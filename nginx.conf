# TutorIngles · Nginx config
#
# Esta es la configuración REAL en producción.
# Ruta en el servidor: /etc/nginx/sites-available/tutoringles
#
# Activar:  ln -s /etc/nginx/sites-available/tutoringles /etc/nginx/sites-enabled/
# SSL:      certbot --nginx -d tutoringles.tinafusion.com
# Recargar: nginx -t && systemctl reload nginx
#
# El backend corre en un contenedor Docker publicado en 127.0.0.1:3401
# (dentro del contenedor escucha en el 3400).
#
# Nota: se hace proxy de TODO a Node, no solo de una lista de rutas. Express
# sirve también los estáticos de la PWA, y así las rutas nuevas de la API
# (/tracks, /situations, /profile…) funcionan sin tocar nginx.

server {
    listen 80;
    server_name tutoringles.tinafusion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tutoringles.tinafusion.com;

    ssl_certificate     /etc/letsencrypt/live/tutoringles.tinafusion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutoringles.tinafusion.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/html application/javascript application/json text/css;

    location / {
        proxy_pass         http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
