# Mantiene despierta la app en Render gratis, que la duerme a los 15 minutos
# sin tráfico. Dormida no corre el planificador y no salen los avisos (el
# diario, el de la almohada y el del despertar), que es lo que hace que la app
# se abra.
#
# Llama a /ping, que no toca la base: así Neon sí puede dormirse y no se gastan
# sus horas de cómputo gratuitas.
#
# SÓLO DE DÍA, y no es un descuido: las 750 horas gratis de Render son por
# cuenta, no por servicio, y en la misma cuenta vive otro servicio gratis
# (n8n). Despierta las 24 h, esta app se comería 744 ella sola y a final de mes
# Render suspendería las dos. De 05:00 a 22:59 UTC son 07:00-01:00 en verano y
# 06:00-00:00 en invierno en Madrid/Suiza: cubre los tres avisos (08:00, 20:30
# y 22:30) con ~560 h al mes. De noche no hace falta: el modo noche cuenta las
# pistas en el móvil y las manda cuando puede (reintenta si Render dormía).
# Un aviso puesto fuera de esa franja no sale.
#
# El cron de GitHub no es puntual: en nov-2026 corría cada varias horas en vez
# de cada 10 minutos. Por eso, desde el 3-nov-2026, la app se llama a sí misma
# durante el día (lib/despierto.js) y este fichero sólo tiene que despertarla.
# La parte delicada es la mañana: la ejecución de medianoche espera dormida
# hasta las 05:00 UTC, y así llega a tiempo aunque GitHub la lance tarde.
# GitHub apaga los cron de un repo sin commits en 60 días.

name: despierta

on:
  schedule:
    - cron: '*/10 5-22 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: despierta
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: esperar a la mañana si es de noche
        run: |
          hora=$(date -u +%-H)
          if [ "$hora" -ge 5 ] && [ "$hora" -le 22 ]; then exit 0; fi
          dia=today
          if [ "$hora" -ge 23 ]; then dia=tomorrow; fi
          espera=$(( $(date -u -d "$dia 05:00" +%s) - $(date -u +%s) ))
          # Un trabajo no puede durar 6 horas: si falta tanto, lo hará otra ejecución.
          if [ "$espera" -gt 19800 ]; then exit 0; fi
          sleep "$espera"
      - name: ping
        env:
          # La variable del repo TUTOR_URL manda si existe.
          URL: ${{ vars.TUTOR_URL || 'https://tutoringles.onrender.com' }}
        # Un arranque en frío de Render tarda hasta un minuto: de ahí el
        # --max-time largo y los reintentos.
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 "$URL/ping"
